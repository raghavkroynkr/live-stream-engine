name: Video Engine Stealth Pro
on:
  workflow_dispatch:
    inputs:
      video_url:
        required: true
      quality:
        default: '1080'

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Stealth Tools
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Fetch Video Direct Link
        id: fetcher
        run: |
          # Asli Chrome browser ka User-Agent use kar rahe hain bypass ke liye
          RESULT_URL=$(yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36" \
          --no-check-certificates \
          --geo-bypass \
          --quiet --get-url \
          -f "bestvideo[height<=${{ github.event.inputs.quality }}]+bestaudio/best" \
          "${{ github.event.inputs.video_url }}")
          
          echo "FINAL_URL=$RESULT_URL" >> $GITHUB_ENV

      - name: Create Artifact Link
        uses: actions/upload-artifact@v4
        with:
          name: download-link
          path: |
            # Hum ek text file mein direct link save kar rahe hain
            echo ${{ env.FINAL_URL }} > link.txt
