name: Universal Video Downloader Pro

on:
  workflow_dispatch:
    inputs:
      video_url:
        required: true
      email:
        required: true
      quality:
        default: 'best'

jobs:
  process-video:
    runs-on: ubuntu-latest
    steps:
      - name: Setup yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp

      - name: Fetch and Compress
        run: |
          QUALITY="${{ github.event.inputs.quality }}"
          URL="${{ github.event.inputs.video_url }}"
          
          if [ "$QUALITY" = "mp3" ]; then
            yt-dlp -x --audio-format mp3 -o "result.%(ext)s" "$URL"
          elif [ "$QUALITY" = "best" ]; then
            yt-dlp -f "best" -o "result.%(ext)s" "$URL"
          else
            # Specific Pixel Quality Logic
            yt-dlp -f "bestvideo[height<=$QUALITY]+bestaudio/best[height<=$QUALITY]" --merge-output-format mp4 -o "result.%(ext)s" "$URL"
          fi

      - name: Create Download Link (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Video-Result-${{ github.run_id }}
          path: result.*
          retention-days: 1

      - name: Send Backup to Email
        shell: python
        env:
          MAIL_USER: ${{ secrets.EMAIL_USER }}
          MAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TARGET_EMAIL: ${{ github.event.inputs.email }}
        run: |
          import smtplib, os
          from email.message import EmailMessage
          files = [f for f in os.listdir('.') if f.startswith('result')]
          if not files: exit(1)
          msg = EmailMessage()
          msg["Subject"] = "Video Download Ready!"
          msg["To"] = os.environ["TARGET_EMAIL"]
          msg["From"] = os.environ["MAIL_USER"]
          msg.set_content("Aapki file attach kar di gayi hai. Agar file badi hai toh GitHub Actions se link download karein.")
          with open(files[0], 'rb') as f:
              msg.add_attachment(f.read(), maintype='application', subtype='octet-stream', filename=files[0])
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(os.environ["MAIL_USER"], os.environ["MAIL_PASS"])
              smtp.send_message(msg)
