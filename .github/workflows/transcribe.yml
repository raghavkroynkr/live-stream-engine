name: Global AI Transcription Engine

on:
  workflow_dispatch:
    inputs:
      file_url:
        required: true
      email:
        required: true
      language:
        default: 'auto'
      task:
        default: 'transcribe'

jobs:
  ai-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AI Software
        run: |
          pip install openai-whisper setuptools-rust
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Whisper AI
        run: |
          curl -L "${{ github.event.inputs.file_url }}" -o input_media
          if [ "${{ github.event.inputs.language }}" = "auto" ]; then
            whisper input_media --model base --task ${{ github.event.inputs.task }} --output_dir output
          else
            whisper input_media --model base --language ${{ github.event.inputs.language }} --task ${{ github.event.inputs.task }} --output_dir output
          fi

      - name: Send Email Result
        shell: python
        env:
          MAIL_USER: ${{ secrets.EMAIL_USER }}
          MAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TARGET_EMAIL: ${{ github.event.inputs.email }}
        run: |
          import smtplib, os
          from email.message import EmailMessage
          from email.utils import formataddr

          output_dir = "output"
          files = [f for f in os.listdir(output_dir) if f.endswith('.txt')]
          if not files:
              print("No output file found")
              exit(1)
          
          file_path = os.path.join(output_dir, files[0])
          with open(file_path, "r", encoding="utf-8") as f:
              content = f.read()

          msg = EmailMessage()
          msg["Subject"] = "LIVE YOUTUBE - AI Transcription Result"
          msg["From"] = formataddr(("Live YouTube AI", os.environ["MAIL_USER"]))
          msg["To"] = os.environ["TARGET_EMAIL"]
          msg.set_content(f"Aapka AI-generated transcript taiyar hai:\n\n{content}\n\nGenerated by LIVE YOUTUBE PRO Engine.")

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(os.environ["MAIL_USER"], os.environ["MAIL_PASS"])
              smtp.send_message(msg)
