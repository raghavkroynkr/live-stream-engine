name: Global AI Transcription Engine

on:
  workflow_dispatch:
    inputs:
      file_url:
        required: true
      email:
        required: true
      language:
        default: 'auto'
      task:
        default: 'transcribe'

jobs:
  ai-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AI Software
        run: |
          pip install openai-whisper setuptools-rust
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Whisper AI
        run: |
          curl -L "${{ github.event.inputs.file_url }}" -o input_media
          if [ "${{ github.event.inputs.language }}" = "auto" ]; then
            whisper input_media --model base --task ${{ github.event.inputs.task }} --output_dir output
          else
            whisper input_media --model base --language ${{ github.event.inputs.language }} --task ${{ github.event.inputs.task }} --output_dir output
          fi

      - name: Send Email Result
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          TARGET_EMAIL: ${{ github.event.inputs.email }}
        run: |
          python3 <<EOF
          import os, smtplib, re, glob
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.utils import formataddr

          # Invisible characters (\xa0) clean karne ke liye taaki login fail na ho
          def clean(text):
              return re.sub(r'[^\x20-\x7E]', '', text).strip() if text else ""

          user = clean(os.environ.get("MAIL_USER"))
          password = clean(os.environ.get("MAIL_PASS"))
          target = os.environ.get("TARGET_EMAIL")
          
          # Whisper ke 'output' folder se file uthana
          files = glob.glob("output/*.txt")
          
          if not files:
              print("❌ Output file nahi mili!")
              exit(1)
          
          with open(files[0], "r", encoding="utf-8") as f:
              content = f.read()

          msg = MIMEMultipart()
          msg["Subject"] = "LIVE YOUTUBE - AI Transcription Result"
          msg["From"] = formataddr(("Live YouTube AI", user))
          msg["To"] = target
          msg.attach(MIMEText(f"Aapka AI transcript taiyar hai:\n\n{content}", 'plain'))

          try:
              # SSL connection for Gmail
              server = smtplib.SMTP_SSL("smtp.gmail.com", 465)
              server.login(user, password)
              server.send_message(msg)
              server.quit()
              print("✅ Mail Sent Successfully!")
          except Exception as e:
              print(f"❌ Login/Email Error: {e}")
              exit(1)
          EOF
