name: AI IMAGE ENGINE

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Describe the image'
        required: true
      aspect_ratio:
        description: 'Ratio'
        required: true
        default: '1:1'

jobs:
  generate:
    runs-on: ubuntu-latest
    # GITHUB KO LIKHNE KI PERMISSION DENA ZAROORI HAI
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Updated to v4 for Node 20 support

      - name: Setup Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Generation Script
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          python - <<EOF
          import os
          import requests
          import time

          # Public Free Inference API
          API_URL = "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0"
          
          prompt = os.getenv("PROMPT")
          print(f"🎨 Generating: {prompt}")

          def query(payload):
              # Try for 3 times if API is loading
              for i in range(3):
                  response = requests.post(API_URL, json=payload)
                  if response.status_code == 200:
                      return response.content
                  print(f"Attempt {i+1}: API is loading, waiting...")
                  time.sleep(10)
              return None

          image_bytes = query({"inputs": prompt})

          if image_bytes:
              os.makedirs("generated_images", exist_ok=True)
              # Unique timestamp for polling detection
              filename = f"generated_images/ai_img_{int(time.time())}.png"
              with open(filename, "wb") as f:
                  f.write(image_bytes)
              print(f"✅ Image saved as {filename}")
          else:
              print("❌ Image generation failed!")
              exit(1)
          EOF

      - name: Commit & Push Image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add generated_images/*.png
          git commit -m "🎨 AI Generated Image Added"
          git push
