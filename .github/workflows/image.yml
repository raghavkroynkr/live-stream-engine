name: AI IMAGE ENGINE

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Describe the image'
        required: true
      aspect_ratio:
        description: 'Ratio (1:1, 16:9, 9:16)'
        required: true
        default: '1:1'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Generation Script
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          RATIO: ${{ github.event.inputs.aspect_ratio }}
        run: |
          python - <<EOF
          import os
          import requests
          import time

          # Gemini-style free inference (Using Stable Diffusion XL or similar)
          API_URL = "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0"
          
          prompt = os.getenv("PROMPT")
          ratio = os.getenv("RATIO")
          
          print(f"🎨 Generating: {prompt} with ratio {ratio}")

          def query(payload):
              # Hum yahan public inference use kar rahe hain jo free hai
              response = requests.post(API_URL, json=payload)
              return response.content

          image_bytes = query({"inputs": prompt})

          # Save the image
          os.makedirs("generated_images", exist_ok=True)
          filename = f"generated_images/ai_img_{int(time.time())}.png"
          
          with open(filename, "wb") as f:
              f.write(image_bytes)
          
          print(f"✅ Image saved as {filename}")
          EOF

      - name: Commit & Push Image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add generated_images/*.png
          git commit -m "🎨 New AI Image Generated"
          git push
