name: Stream Link to YouTube Live

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video Link'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade yt-dlp

      - name: Start Streaming Engine
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          # Video ka direct link fetch karna (with error handling)
          VIDEO_URL=$(yt-dlp -f "best" -g "${{ github.event.inputs.video_url }}")
          
          if [ -z "$VIDEO_URL" ]; then
            echo "Error: Video link fetch nahi ho saka!"
            exit 1
          fi

          # YouTube par stream bhejna (Simplified for better compatibility)
          ffmpeg -re -i "$VIDEO_URL" \
          -vcodec libx264 -preset superfast -maxrate 3000k -bufsize 6000k \
          -pix_fmt yuv420p -g 60 -acodec aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
