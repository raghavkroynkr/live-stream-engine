name: STREAM ENGINE

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: 'Comma separated video URLs'
        required: true
      stream_key:
        description: 'YouTube Stream Key'
        required: true
      duration:
        description: 'Duration in seconds'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Engine
        run: |
          # Playlist setup logic
          IFS=',' read -ra ADDR <<< "${{ github.event.inputs.video_urls }}"
          > playlist.txt
          for i in "${ADDR[@]}"; do
            echo "file '$(echo $i | xargs)'" >> playlist.txt
          done

          echo "🚀 Stream looping active..."
          
          # Stable Looper Command
          ffmpeg -re -f concat -safe 0 -protocol_whitelist "file,http,https,tcp,tls" \
          -stream_loop -1 -i playlist.txt \
          -t ${{ github.event.inputs.duration }} \
          -vcodec libx264 -preset superfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
          -pix_fmt yuv420p -g 60 -acodec aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/${{ github.event.inputs.stream_key }}"
