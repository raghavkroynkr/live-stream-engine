name: Stream Link to YouTube Live

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video Link'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade yt-dlp

      - name: Run Streaming Engine
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          # Video ka direct link fetch kar rahe hain
          VIDEO_URL=$(yt-dlp -f "best" -g "${{ github.event.inputs.video_url }}")
          
          # Agar link nahi mila toh error dikhaye
          if [ -z "$VIDEO_URL" ]; then
            echo "Error: Could not fetch video URL"
            exit 1
          fi

          # YouTube Server par stream bhej rahe hain
          ffmpeg -re -i "$VIDEO_URL" \
          -c:v libx264 -preset superfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
