name: Stream Link to YouTube Live

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video Link'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade yt-dlp

      - name: Start Streaming Engine
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          # Sabse pehle user-agent badal kar link nikalne ki koshish
          VIDEO_URL=$(yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -f "best" -g "${{ github.event.inputs.video_url }}")
          
          if [ -z "$VIDEO_URL" ]; then
            echo "Error: YouTube block kar raha hai. Ek baar normal video link try karein."
            exit 1
          fi

          # FFmpeg Streaming
          ffmpeg -re -i "$VIDEO_URL" \
          -vcodec libx264 -preset superfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 -acodec aac -b:a 128k -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
