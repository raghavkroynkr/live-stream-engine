<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA DOWNLOADER PRO</title>
    <style>
        :root { --gold: #ffcc00; --dark: #0a0a0c; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Inter', sans-serif; background: var(--dark); background-image: radial-gradient(circle at 50% -20%, #443300 0%, var(--dark) 80%); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 420px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 30px; box-sizing: border-box; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .header h1 { font-size: 28px; font-weight: 900; text-align: center; background: linear-gradient(135deg, #ffcc00, #ff8800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        .input-field { width: 100%; padding: 15px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; margin-bottom: 12px; box-sizing: border-box; font-size: 14px; }
        .input-field:focus { border-color: var(--gold); outline: none; }
        .label-text { font-size: 12px; color: #888; margin-bottom: 5px; margin-left: 5px; display: block; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 15px; color: #000; font-weight: 800; cursor: pointer; text-transform: uppercase; background: linear-gradient(135deg, #ffcc00, #ff8800); transition: 0.3s; margin-top: 10px; }
        .btn:active { transform: scale(0.97); }
        #status { margin-top: 20px; padding: 15px; border-radius: 12px; background: rgba(255,255,255,0.03); font-size: 13px; text-align: center; color: #aaa; border: 1px solid rgba(255,255,255,0.05); }
        .back-btn { align-self: flex-start; color: #555; text-decoration: none; font-size: 14px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← DASHBOARD</a>
    <div class="container">
        <div class="header"><h1>ULTRA DOWNLOADER</h1></div>
        <p style="text-align:center; font-size:11px; color:#555; margin-top:5px; margin-bottom:25px;">Premium 4K Video Cloud Grabber</p>
        
        <span class="label-text">Video Source</span>
        <input type="text" id="vidUrl" class="input-field" placeholder="Paste Link (YT, FB, Insta, Twitter)">
        
        <span class="label-text">Select Quality (Resolution)</span>
        <select id="res" class="input-field">
            <option value="best">Auto (Best Quality)</option>
            <option value="2160">4K Ultra HD (2160p)</option>
            <option value="1440">Quad HD (1440p)</option>
            <option value="1080">Full HD (1080p)</option>
            <option value="720">HD Ready (720p)</option>
            <option value="480">Standard (480p)</option>
            <option value="mp3">Audio Only (MP3)</option>
        </select>
        
        <span class="label-text">Email (For Backup Copy)</span>
        <input type="email" id="userEmail" class="input-field" placeholder="Enter Email ID">
        
        <span class="label-text">Access Token</span>
        <input type="password" id="gToken" class="input-field" placeholder="GitHub Personal Token">
        
        <button class="btn" onclick="startUltraDownload()">⚡ Generate Download Link</button>
        
        <div id="status">System Status: Ready to Fetch</div>
    </div>

    <script>
        async function startUltraDownload() {
            const urlInp = document.getElementById('vidUrl');
            const emailInp = document.getElementById('userEmail');
            const tokenInp = document.getElementById('gToken');
            const res = document.getElementById('res').value;
            const status = document.getElementById('status');

            // Smart Validation
            if (!urlInp.value.trim()) { alert("⚠️ Bhai, Video Link box khali hai!"); urlInp.focus(); return; }
            if (!emailInp.value.trim()) { alert("⚠️ Bhai, Backup Email toh daalo!"); emailInp.focus(); return; }
            if (!tokenInp.value.trim()) { alert("⚠️ Bhai, Token missing hai!"); tokenInp.focus(); return; }

            status.innerText = "⏳ Cloud Engine connecting...";
            status.style.color = "#ffcc00";

            try {
                const response = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/downloader.yml/dispatches', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${tokenInp.value.trim()}` },
                    body: JSON.stringify({ 
                        ref: 'main', 
                        inputs: { 
                            video_url: urlInp.value.trim(), 
                            email: emailInp.value.trim(), 
                            quality: res 
                        } 
                    })
                });

                if(response.status === 204) {
                    status.innerHTML = "🚀 Request Successful!<br>1. Check GitHub 'Actions' for direct link.<br>2. Backup file sent to Email.";
                    status.style.color = "#00ff88";
                } else {
                    status.innerText = "❌ Error: Token invalid ya permissions missing!";
                    status.style.color = "#ff4444";
                }
            } catch(e) {
                status.innerText = "❌ Connection Failed!";
                status.style.color = "#ff4444";
            }
        }
    </script>
</body>
</html>
