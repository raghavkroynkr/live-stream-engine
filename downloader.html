<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA DOWNLOADER V8</title>
    <style>
        :root { --gold: #ffcc00; --dark: #0a0a0c; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .back-link { align-self: flex-start; color: #555; text-decoration: none; font-size: 14px; margin-bottom: 20px; }
        .container { width: 100%; max-width: 400px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 30px; box-sizing: border-box; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 26px; font-weight: 900; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; }
        .sub-text { font-size: 10px; color: #666; margin-bottom: 25px; }
        .input-field { width: 100%; padding: 15px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; margin-top: 15px; box-sizing: border-box; outline: none; }
        .input-field:focus { border-color: var(--gold); }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 15px; color: #000; font-weight: 800; cursor: pointer; text-transform: uppercase; background: linear-gradient(135deg, #ffcc00, #ff8800); margin-top: 25px; transition: 0.3s; }
        .btn:active { transform: scale(0.98); }
        #resArea { display: none; margin-top: 25px; padding: 20px; border-radius: 15px; background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; animation: slideUp 0.4s ease; }
        .dl-now { background: #00ff88; color: #000; padding: 12px 25px; border-radius: 10px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 10px; width: 80%; }
        @keyframes slideUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← DASHBOARD</a>

    <div class="container">
        <h1>DOWNLOADER</h1>
        <div class="sub-text">Bypassing Cloud Blocks... Direct Engine Active</div>
        
        <input type="text" id="videoUrl" class="input-field" placeholder="Paste Video Link (YouTube, Insta, FB)">
        
        <select id="quality" class="input-field">
            <option value="1080">Full HD (1080p)</option>
            <option value="720" selected>HD (720p)</option>
            <option value="480">SD (480p)</option>
            <option value="mp3">Audio Only (MP3)</option>
        </select>
        
        <button class="btn" onclick="fetchVideo()">⚡ GET DOWNLOAD LINK</button>
        
        <div id="status" style="margin-top:15px; font-size:12px; color:#888;">System Ready</div>

        <div id="resArea">
            <p style="color:#00ff88; font-weight:bold; margin:0 0 10px 0;">✅ Ready to Download!</p>
            <a id="downloadBtn" href="#" class="dl-now" target="_blank">⬇️ SERVER 1 (Direct)</a>
            <a id="backupBtn" href="#" class="dl-now" target="_blank" style="background:#ffcc00; margin-top:5px;">⬇️ SERVER 2 (Backup)</a>
        </div>
    </div>

<script>
    async function fetchVideo() {
        const url = document.getElementById('videoUrl').value.trim();
        const quality = document.getElementById('quality').value;
        const status = document.getElementById('status');
        const resArea = document.getElementById('resArea');
        const downloadBtn = document.getElementById('downloadBtn');
        const backupBtn = document.getElementById('backupBtn');

        if(!url) { 
            alert("Bhai, Pehle video link toh daalo!"); 
            return; 
        }

        status.innerText = "⏳ Bypassing YouTube Firewall... (Mobile-Direct Mode)";
        resArea.style.display = "none";

        try {
            // Hum un mirrors ka use karenge jo block nahi hote
            setTimeout(() => {
                status.innerText = "🚀 Server Connected Successfully!";
                
                // Server 1: Ultra Fast (Shorts aur Videos ke liye best)
                // Ismein reloading loop ka problem nahi aayega
                downloadBtn.href = `https://9xbuddy.in/process?url=${encodeURIComponent(url)}`;
                downloadBtn.innerText = "⬇️ DOWNLOAD (SERVER 1 - HIGH SPEED)";

                // Server 2: Backup Mirror (Sabse reliable bypass engine)
                if(backupBtn) {
                    backupBtn.href = `https://save.tube/parse?url=${encodeURIComponent(url)}`;
                    backupBtn.innerText = "⬇️ DOWNLOAD (SERVER 2 - BACKUP)";
                }

                resArea.style.display = "block";
                status.innerText = "✅ Link Ready! Choose your quality on the next page.";
            }, 1200);

        } catch (error) {
            status.innerText = "❌ Connection Refused! Refresh karke firse try karein.";
        }
    }
</script>


</body>
</html>
