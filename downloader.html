<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-DOWNLOADER PRO</title>
    <style>
        :root { --accent: #ffcc00; --dark: #080808; }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .downloader-card { width: 100%; max-width: 400px; background: rgba(255,255,255,0.03); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.08); border-radius: 35px; padding: 35px; box-shadow: 0 40px 100px rgba(0,0,0,0.8); text-align: center; }
        h1 { font-size: 24px; font-weight: 900; color: var(--accent); margin-bottom: 30px; text-transform: uppercase; }
        .input-box { width: 100%; padding: 18px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; color: white; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; }
        .main-btn { width: 100%; padding: 20px; border: none; border-radius: 20px; background: var(--accent); color: black; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.4s; }
        #dlSection { display: none; margin-top: 25px; padding: 20px; border-radius: 20px; background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; }
        .dl-link { display: block; background: #00ff88; color: #000; padding: 15px; border-radius: 15px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="downloader-card">
        <h1>X-DOWNLOADER</h1>
        <input type="text" id="vUrl" class="input-box" placeholder="Video Link Paste Karein">
        <select id="pax" class="input-box">
            <option value="2160">4K Ultra HD (2160p)</option>
            <option value="1080" selected>Full HD (1080p)</option>
            <option value="720">HD (720p)</option>
        </select>
        <input type="password" id="tok" class="input-box" placeholder="GitHub Token (ghp_...)">
        <button class="main-btn" onclick="generate()">⚡ Start Generation</button>
        
        <div id="status" style="margin-top:15px; font-size:12px; color:#888;"></div>

        <div id="dlSection">
            <span style="color:#00ff88; font-weight:bold;">✅ Link Ready!</span>
            <a id="finalBtn" href="#" class="dl-link" target="_blank">⬇️ DOWNLOAD NOW</a>
        </div>
    </div>

    <script>
        async function generate() {
            const url = document.getElementById('vUrl').value.trim();
            const token = document.getElementById('tok').value.trim();
            const status = document.getElementById('status');
            
            if(!url || !token) { alert("Bhai, details bharna bhool gaye!"); return; }

            status.innerText = "⏳ Bypassing YouTube Bots... wait 5 sec";
            
            // Trigger GitHub Engine
            const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/downloader.yml/dispatches', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ ref: 'main', inputs: { video_url: url, quality: document.getElementById('pax').value } })
            });

            if(res.status === 204) {
                // Yahan hum direct link proxy ka use kar rahe hain bypass ke liye
                setTimeout(() => {
                    status.innerText = "🚀 Direct Link Generated!";
                    document.getElementById('dlSection').style.display = "block";
                    // Instant link fallback
                    document.getElementById('finalBtn').href = `https://loader.to/api/button/?url=${url}&f=${document.getElementById('pax').value}`;
                }, 4000);
            } else {
                status.innerText = "❌ Token Error! Please check.";
            }
        }
    </script>
</body>
</html>
