<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-DOWNLOADER PRO</title>
    <style>
        :root { --accent: #ffcc00; --dark: #080808; --card: rgba(255, 255, 255, 0.03); }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .downloader-card { width: 100%; max-width: 400px; background: var(--card); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.08); border-radius: 35px; padding: 35px; box-shadow: 0 40px 100px rgba(0,0,0,0.8); text-align: center; }
        h1 { font-size: 24px; font-weight: 900; letter-spacing: 2px; color: var(--accent); margin-bottom: 30px; text-transform: uppercase; }
        .input-box { width: 100%; padding: 18px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; color: white; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; transition: 0.3s; }
        .input-box:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 15px rgba(255, 204, 0, 0.1); }
        .main-btn { width: 100%; padding: 20px; border: none; border-radius: 20px; background: var(--accent); color: black; font-weight: 800; font-size: 16px; cursor: pointer; text-transform: uppercase; transition: 0.4s; }
        .main-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 204, 0, 0.3); }
        
        /* Result Section */
        #resultArea { display: none; margin-top: 25px; padding: 20px; border-radius: 20px; background: rgba(0, 255, 136, 0.05); border: 1px solid rgba(0, 255, 136, 0.2); animation: slideUp 0.5s ease; }
        .dl-link { display: block; background: #00ff88; color: #000; padding: 15px; border-radius: 15px; text-decoration: none; font-weight: bold; margin-top: 10px; font-size: 14px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="downloader-card">
        <h1>X-DOWNLOADER</h1>
        
        <input type="text" id="vUrl" class="input-box" placeholder="Video Link Paste Karein">
        
        <select id="pax" class="input-box">
            <option value="2160">4K Ultra HD (2160p)</option>
            <option value="1440">2K Quad HD (1440p)</option>
            <option value="1080" selected>Full HD (1080p)</option>
            <option value="720">HD (720p)</option>
            <option value="480">SD (480p)</option>
        </select>
        
        <input type="password" id="tok" class="input-box" placeholder="GitHub Access Token">
        
        <button class="main-btn" onclick="generateLink()">⚡ Create Link</button>
        
        <div id="loader" style="display:none; margin-top:15px; font-size:12px; color:#888;">⏳ Cloud fetching... link generate ho rahi hai...</div>

        <div id="resultArea">
            <span style="color:#00ff88; font-size:12px;">✅ Video Ready!</span>
            <a id="finalBtn" href="#" class="dl-link" download>⬇️ DOWNLOAD VIDEO NOW</a>
        </div>
    </div>

    <script>
        async function generateLink() {
            const url = document.getElementById('vUrl').value.trim();
            const token = document.getElementById('tok').value.trim();
            const pixel = document.getElementById('pax').value;
            
            if(!url || !token) { alert("Bhai, dono cheezen bharna zaroori hai!"); return; }

            document.getElementById('loader').style.display = "block";
            document.getElementById('resultArea').style.display = "none";

            try {
                // Backend Trigger
                const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/downloader.yml/dispatches', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ ref: 'main', inputs: { video_url: url, quality: pixel } })
                });

                if(res.status === 204) {
                    // Logic: Hum user ko direct third-party high speed link de rahe hain polling ke bina
                    setTimeout(() => {
                        document.getElementById('loader').style.display = "none";
                        document.getElementById('resultArea').style.display = "block";
                        // Yeh link fast server se generate hogi
                        document.getElementById('finalBtn').href = `https://loader.to/api/button/?url=${url}&f=${pixel}`;
                    }, 3000);
                }
            } catch(e) { alert("Network Error!"); }
        }
    </script>
</body>
</html>
