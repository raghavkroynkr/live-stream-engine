<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK BUILDER PRO</title>
    <style>
        :root {
            --neon-green: #00ff88;
            --dark-bg: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
            --grad-green: linear-gradient(135deg, #00ff88 0%, #008855 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            background-image: radial-gradient(circle at 50% -20%, #004422 0%, var(--dark-bg) 80%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            text-align: center;
            text-transform: uppercase;
            background: var(--grad-green);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            align-self: flex-start;
            color: #666;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 14px;
            transition: 0.3s;
        }
        .back-btn:hover { color: var(--neon-green); }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 12px;
            display: block;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--neon-green);
            background: rgba(0, 255, 136, 0.05);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            color: #000;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            margin-top: 10px;
            background: var(--grad-green);
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
        }

        .btn:active { transform: scale(0.96); }

        .status-bar {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            font-size: 13px;
            text-align: center;
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← DASHBOARD</a>

    <div class="container">
        <div class="header">
            <h1>APK BUILDER</h1>
            <p style="text-align:center; font-size:11px; color:#555; margin-top:5px; text-transform: none;">Ad-Free Cloud Compiler</p>
        </div>

        <div style="margin-top: 25px;">
            <input type="text" id="webUrl" class="input-field" placeholder="Website URL (https://...)">
            <input type="text" id="appName" class="input-field" placeholder="App Name (e.g. My Pro App)">
            <input type="email" id="userEmail" class="input-field" placeholder="Target Email (Result ke liye)">
            <input type="password" id="gToken" class="input-field" placeholder="GitHub Token (ghp_...)">
            
            <button class="btn" onclick="buildAPK()">🔨 Compile & Send APK</button>
        </div>

        <div id="status" class="status-bar">
            System: Waiting for Request
        </div>
    </div>

    <script>
        async function buildAPK() {
            const url = document.getElementById('webUrl').value.trim();
            const name = document.getElementById('appName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const token = document.getElementById('gToken').value.trim();
            const status = document.getElementById('status');

            if(!url || !name || !email || !token) { 
                alert("Bhai, sari details bhariye tabhi engine start hoga!"); 
                return; 
            }

            status.innerText = "⏳ Initializing Cloud Builder...";
            status.style.color = "#aaa";

            try {
                const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/apk-engine.yml/dispatches', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({ 
                        ref: 'main', 
                        inputs: { 
                            web_url: url, 
                            app_name: name,
                            email: email
                        } 
                    })
                });

                if(res.status === 204) {
                    status.innerHTML = "✅ Build Sequence Started!<br>Check Email in 8-10 mins.";
                    status.style.color = "var(--neon-green)";
                } else {
                    status.innerText = "❌ Error: Token invalid ya Workflow missing!";
                    status.style.color = "#ff4444";
                }
            } catch (e) {
                status.innerText = "❌ Connection Failed!";
                status.style.color = "#ff4444";
            }
        }
    </script>
</body>
</html>
