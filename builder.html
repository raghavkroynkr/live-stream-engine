<div class="container">
    <h1 style="text-align:center; color:#00ff88;">APK BUILDER</h1>
    <input type="text" id="webUrl" class="input-field" placeholder="Website Link (https://...)">
    <input type="text" id="appName" class="input-field" placeholder="App Name">
    <input type="email" id="userEmail" class="input-field" placeholder="Aapka Email ID">
    <input type="password" id="gToken" class="input-field" placeholder="GitHub Token">
    
    <button class="btn" onclick="buildAPK()">🔨 Build & Send to Email</button>
    <div id="status" style="text-align:center; margin-top:15px; font-size:12px; color:#888;">Ready</div>
</div>

<script>
    async function buildAPK() {
        const url = document.getElementById('webUrl').value;
        const name = document.getElementById('appName').value;
        const email = document.getElementById('userEmail').value;
        const token = document.getElementById('gToken').value;

        if(!url || !name || !email || !token) { alert("Bhai, sari details bhariye!"); return; }

        document.getElementById('status').innerText = "⏳ Requesting Build...";
        const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/apk-engine.yml/dispatches', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ 
                ref: 'main', 
                inputs: { web_url: url, app_name: name, email: email } 
            })
        });
        if(res.status === 204) {
            document.getElementById('status').innerText = "✅ Build Started! 5-8 min mein email check karein.";
        }
    }
</script>
