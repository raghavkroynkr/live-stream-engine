<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator | Pro Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top left, #1e1b4b, #000000);
            color: white;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-border:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
        }
    </style>
</head>
<body class="p-4 md:p-10 font-sans">

    <div class="max-w-4xl mx-auto text-center mb-10">
        <h1 class="text-4xl md:text-6xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600 mb-4">
            Focal AI Video Gen
        </h1>
        <p class="text-gray-400 text-lg">Create viral clips using advanced AI models for free.</p>
    </div>

    <div class="max-w-4xl mx-auto glass-card rounded-3xl p-6 md:p-8 shadow-2xl">
        
        <div class="mb-8">
            <label class="block text-sm font-medium text-purple-300 mb-2">Video Prompt</label>
            <textarea id="promptInput" rows="4" 
                class="w-full bg-black/40 border border-white/10 rounded-xl p-4 text-white placeholder-gray-500 neon-border outline-none transition-all"
                placeholder="Example: A futuristic guitar player performing on Mars, 4k, cinematic lighting..."></textarea>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="p-3 bg-white/5 rounded-lg border border-white/5 text-center">
                <span class="text-xs text-gray-400 block uppercase">Ratio</span>
                <span class="font-bold">9:16</span>
            </div>
            <div class="p-3 bg-white/5 rounded-lg border border-white/5 text-center">
                <span class="text-xs text-gray-400 block uppercase">Duration</span>
                <span class="font-bold">3 Sec</span>
            </div>
            <div class="p-3 bg-white/5 rounded-lg border border-white/5 text-center">
                <span class="text-xs text-gray-400 block uppercase">Style</span>
                <span class="font-bold">Cinematic</span>
            </div>
            <div class="p-3 bg-white/5 rounded-lg border border-white/5 text-center">
                <span class="text-xs text-gray-400 block uppercase">Engine</span>
                <span class="font-bold">Stable Video</span>
            </div>
        </div>

        <button onclick="startGeneration()" id="genBtn"
            class="w-full py-4 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 rounded-xl font-bold text-lg transition-transform active:scale-95 shadow-lg shadow-purple-500/20">
            Generate Magic Video
        </button>

        <div id="loading" class="hidden mt-10 text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
            <p class="mt-4 text-gray-400">AI is dreaming your video... (It may take 1-2 mins)</p>
        </div>

        <div id="outputContainer" class="hidden mt-10 rounded-xl overflow-hidden border border-white/10 shadow-2xl">
            <video id="resultVideo" controls class="w-full bg-black">
                Your browser does not support the video tag.
            </video>
            <div class="p-4 bg-white/5 flex justify-between items-center">
                <span class="text-sm text-gray-400">Ready to download!</span>
                <button class="text-purple-400 font-semibold hover:underline">Download MP4</button>
            </div>
        </div>
    </div>

    <script>
        function startGeneration() {
            const prompt = document.getElementById('promptInput').value;
            if(!prompt) {
                alert("Please enter a prompt first!");
                return;
            }

            // UI Changes
            document.getElementById('genBtn').disabled = true;
            document.getElementById('genBtn').innerText = "Processing...";
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('outputContainer').classList.add('hidden');

            // API Integration Logic (Placeholder)
            // Yahan aap Hugging Face ya kisi free API ka fetch call lagayenge
            setTimeout(() => {
                // Ye sirf demonstration ke liye hai
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('outputContainer').classList.remove('hidden');
                document.getElementById('genBtn').disabled = false;
                document.getElementById('genBtn').innerText = "Generate Magic Video";
            }, 5000); 
        }
    </script>
</body>
</html>
