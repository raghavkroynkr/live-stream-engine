<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator | Pro Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top left, #1e1b4b, #000000);
            color: white;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-border:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
        }
    </style>
</head>
<body class="p-4 md:p-10 font-sans">

    <div class="max-w-4xl mx-auto text-center mb-10">
        <h1 class="text-4xl md:text-6xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600 mb-4">
            Focal AI Video Gen
        </h1>
        <p class="text-gray-400 text-lg">Create viral clips using advanced AI models for free.</p>
    </div>

    <div class="max-w-4xl mx-auto glass-card rounded-3xl p-6 md:p-8 shadow-2xl">
        
        <div class="mb-8">
            <label class="block text-sm font-medium text-purple-300 mb-2">Video Prompt</label>
            <textarea id="promptInput" rows="4" 
                class="w-full bg-black/40 border border-white/10 rounded-xl p-4 text-white placeholder-gray-500 neon-border outline-none transition-all"
                placeholder="Example: A futuristic guitar player performing on Mars, 4k, cinematic lighting..."></textarea>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="p-3 bg-white/5 rounded-lg border border-white/5 text-center">
                <span class="text-xs text-gray-400 block uppercase">Ratio</span>
                <span class="font-bold">9:16</span>
            </div>
            <div class="p-3 bg-white/5 rounded-lg border border-white/5 text-center">
                <span class="text-xs text-gray-400 block uppercase">Duration</span>
                <span class="font-bold">3 Sec</span>
            </div>
            <div class="p-3 bg-white/5 rounded-lg border border-white/5 text-center">
                <span class="text-xs text-gray-400 block uppercase">Style</span>
                <span class="font-bold">Cinematic</span>
            </div>
            <div class="p-3 bg-white/5 rounded-lg border border-white/5 text-center">
                <span class="text-xs text-gray-400 block uppercase">Engine</span>
                <span class="font-bold">ModelScope</span>
            </div>
        </div>

        <button onclick="startGeneration()" id="genBtn"
            class="w-full py-4 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 rounded-xl font-bold text-lg transition-transform active:scale-95 shadow-lg shadow-purple-500/20">
            Generate Magic Video
        </button>

        <div id="loading" class="hidden mt-10 text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
            <p class="mt-4 text-gray-400 italic" id="statusText">AI is dreaming your video... (It may take 1-2 mins)</p>
        </div>

        <div id="outputContainer" class="hidden mt-10 rounded-xl overflow-hidden border border-white/10 shadow-2xl">
            <video id="resultVideo" controls class="w-full bg-black">
                Your browser does not support the video tag.
            </video>
            <div class="p-4 bg-white/5 flex justify-between items-center">
                <span class="text-sm text-gray-400">Ready to download!</span>
                <a id="downloadBtn" href="#" download="ai-video.mp4" class="text-purple-400 font-semibold hover:underline">Download MP4</a>
            </div>
        </div>
    </div>

    <script>
        // 1. Apni API Key yahan dalein
        const HF_TOKEN = "YOUR_HUGGING_FACE_TOKEN_HERE"; 

        async function startGeneration() {
            const prompt = document.getElementById('promptInput').value;
            const genBtn = document.getElementById('genBtn');
            const loading = document.getElementById('loading');
            const outputContainer = document.getElementById('outputContainer');
            const resultVideo = document.getElementById('resultVideo');
            const downloadBtn = document.getElementById('downloadBtn');

            if(!prompt) {
                alert("Bhai, pehle prompt toh likho!");
                return;
            }

            // UI Reset & Loading State
            genBtn.disabled = true;
            genBtn.innerText = "Processing...";
            genBtn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            outputContainer.classList.add('hidden');

            try {
                // 2. API Call
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/ali-vilab/modelscope-damo-text-to-video-hd",
                    {
                        headers: { 
                            "Authorization": `Bearer ${HF_TOKEN}`,
                            "Content-Type": "application/json" 
                        },
                        method: "POST",
                        body: JSON.stringify({ inputs: prompt }),
                    }
                );

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "Model load ho raha hai, 1 minute baad try karein.");
                }

                const blob = await response.blob();
                const videoUrl = URL.createObjectURL(blob);
                
                // 3. Show Result
                resultVideo.src = videoUrl;
                downloadBtn.href = videoUrl; // Download link update
                
                loading.classList.add('hidden');
                outputContainer.classList.remove('hidden');

            } catch (error) {
                alert("Alert: " + error.message);
                loading.classList.add('hidden');
            } finally {
                genBtn.disabled = false;
                genBtn.innerText = "Generate Magic Video";
                genBtn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
