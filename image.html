<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI IMAGE CREATOR - V3.5 PRO</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#bc13fe">
    
    <style>
        :root { --neon-purple: #bc13fe; --dark-bg: #050505; --card-bg: rgba(20, 20, 25, 0.9); }
        
        body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }

        /* Top Navigation */
        .top-nav { width: 100%; max-width: 500px; padding: 10px 0 20px 5px; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: #666; text-decoration: none; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; letter-spacing: 1px; transition: 0.3s; }
        .back-btn:hover { color: var(--neon-purple); }
        .app-status { font-size: 11px; color: #444; text-transform: uppercase; letter-spacing: 1px; }

        /* Output Area */
        .output-container { width: 100%; max-width: 500px; min-height: 320px; background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid rgba(188, 19, 254, 0.15); border-radius: 30px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.7); }
        
        #generatedImage { max-width: 100%; border-radius: 18px; box-shadow: 0 0 40px rgba(188, 19, 254, 0.25); display: none; transition: 0.5s ease-in-out; }
        
        .placeholder-text { color: #555; font-size: 14px; text-align: center; font-weight: 500; letter-spacing: 0.5px; }

        /* Download Button */
        .download-btn { display: none; margin-top: 20px; padding: 12px 30px; background: rgba(0, 255, 204, 0.1); border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 50px; color: #00ffcc; text-decoration: none; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s; }
        .download-btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); }

        /* Fixed Prompt Area */
        .chat-area { width: 100%; max-width: 500px; position: fixed; bottom: 20px; z-index: 100; }
        .input-box { background: rgba(15, 15, 20, 0.95); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 12px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 -10px 50px rgba(0,0,0,0.8); }
        
        textarea { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 15px; resize: none; min-height: 45px; max-height: 120px; padding: 8px 0; font-family: inherit; }

        select { background: #15151a; color: #888; border: 1px solid #333; border-radius: 12px; padding: 8px; font-size: 11px; outline: none; cursor: pointer; transition: 0.3s; }
        select:focus { border-color: var(--neon-purple); color: white; }

        .gen-btn { background: var(--neon-purple); border: none; border-radius: 50%; width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 20px rgba(188, 19, 254, 0.4); }
        .gen-btn:hover { transform: scale(1.1) rotate(-5deg); box-shadow: 0 0 35px var(--neon-purple); }
        .gen-btn:disabled { background: #222; cursor: not-allowed; box-shadow: none; transform: none; }

        /* Loader */
        .loader { border: 3px solid rgba(188, 19, 254, 0.1); border-top: 3px solid var(--neon-purple); border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite; display: none; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Token UI */
        .token-container { margin-bottom: 20px; width: 100%; max-width: 500px; }
        .token-input { width: 100%; padding: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; color: #444; font-size: 11px; box-sizing: border-box; text-align: center; transition: 0.3s; }
        .token-input:focus { border-color: var(--neon-purple); color: #aaa; background: rgba(188, 19, 254, 0.05); }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="back-btn">← DASHBOARD</a>
        <div class="app-status">Viral Tube Engine v3.5</div>
    </div>

    <div class="token-container">
        <input type="password" id="gToken" class="token-input" placeholder="🔒 Enter GitHub Token to authorize engine...">
    </div>

    <div class="output-container" id="mainDisplay">
        <div class="loader" id="loader"></div>
        <div class="placeholder-text" id="placeholder">Describe your vision below...</div>
        <img id="generatedImage" alt="AI Output">
        <a id="downloadBtn" class="download-btn" download="ViralTube_AI.png">⬇️ Download Image</a>
    </div>

    <div style="height: 130px;"></div>

    <div class="chat-area">
        <div class="input-box">
            <textarea id="prompt" placeholder="Gemini: An astronaut riding a horse on Mars, cinematic..."></textarea>
            
            <select id="ratio">
                <option value="1:1">1:1</option>
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
            </select>

            <button class="gen-btn" id="genBtn" onclick="runImageEngine()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('placeholder');
        const loader = document.getElementById('loader');
        const imageDisplay = document.getElementById('generatedImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const genBtn = document.getElementById('genBtn');

        // FIXED REPO CONFIG
        const owner = 'raghavkroynkr'; 
        const repo = 'live-stream-engine'; 
        const folder = 'generated_images';

        async function runImageEngine() {
            const prompt = document.getElementById('prompt').value.trim();
            const token = document.getElementById('gToken').value.trim();
            const ratio = document.getElementById('ratio').value;

            if(!prompt || !token) { alert("Bhai, Prompt aur Token dono dalna padega!"); return; }

            // UI Reset for new generation
            statusText.innerHTML = "🚀 Waking up the Engine...";
            statusText.style.color = "#bc13fe";
            loader.style.display = "block";
            imageDisplay.style.display = "none";
            downloadBtn.style.display = "none";
            genBtn.disabled = true;

            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/image.yml/dispatches`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github+json',
                        'X-GitHub-Api-Version': '2022-11-28'
                    },
                    body: JSON.stringify({ ref: 'main', inputs: { prompt: prompt, aspect_ratio: ratio } })
                });

                if(res.status === 204) {
                    statusText.innerHTML = "🎨 AI is painting your vision... (Attempt 0/30)";
                    startPolling(token);
                } else {
                    alert("GitHub Error: " + res.status + " (Check Token Permissions)");
                    resetUI();
                }
            } catch (err) { alert("Internet Check Karo Bhai!"); resetUI(); }
        }

        let pollInterval;
        function startPolling(token) {
            let attempts = 0;
            if (pollInterval) clearInterval(pollInterval);
            
            pollInterval = setInterval(async () => {
                attempts++;
                const cacheBuster = new Date().getTime();
                statusText.innerHTML = `🎨 AI is painting... Attempt ${attempts}/30`;

                try {
                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folder}?t=${cacheBuster}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });

                    if (res.ok) {
                        const files = await res.json();
                        const imageFiles = files.filter(f => f.name.endsWith('.png'));
                        
                        if (imageFiles.length > 0) {
                            imageFiles.sort((a, b) => b.name.localeCompare(a.name)); 
                            const latest = imageFiles[0];
                            
                            // Stop polling and display
                            clearInterval(pollInterval);
                            displayImage(`${latest.download_url}?t=${cacheBuster}`);
                        }
                    }
                } catch (e) { console.error("Waiting for repo..."); }

                if (attempts >= 30) {
                    clearInterval(pollInterval);
                    statusText.innerHTML = "❌ Time Out! Check GitHub Action tab for errors.";
                    genBtn.disabled = false;
                }
            }, 10000); // Check every 10 seconds
        }

        function displayImage(imageUrl) {
            imageDisplay.src = imageUrl;
            downloadBtn.href = imageUrl;
            
            imageDisplay.onload = function() {
                loader.style.display = "none";
                statusText.style.display = "none";
                imageDisplay.style.display = "block";
                downloadBtn.style.display = "inline-flex";
                genBtn.disabled = false;
                document.getElementById('prompt').value = ""; // Clear box
            }
        }

        function resetUI() {
            loader.style.display = "none";
            statusText.innerHTML = "Describe your vision below...";
            genBtn.disabled = false;
        }
    </script>
</body>
</html>
