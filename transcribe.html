<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TRANSCRIBER</title>
    <style>
        :root { --blue: #00d4ff; --dark: #0a0a0c; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Inter', sans-serif; background: var(--dark); background-image: radial-gradient(circle at 50% -20%, #002244 0%, var(--dark) 80%); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 400px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 25px; box-sizing: border-box; }
        .header h1 { font-size: 28px; font-weight: 900; text-align: center; text-transform: uppercase; color: var(--blue); margin: 0; }
        .back-btn { align-self: flex-start; color: #666; text-decoration: none; font-size: 14px; margin-bottom: 15px; }
        .input-field { width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; margin-bottom: 12px; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 15px; color: white; font-weight: 800; cursor: pointer; text-transform: uppercase; background: linear-gradient(135deg, #0088ff, #00d4ff); }
        #status { text-align:center; margin-top:15px; color:#888; font-size:13px; }
        /* Naya Section for Result Link */
        .result-link-box { display: none; margin-top: 15px; text-align: center; padding: 10px; border: 1px dashed var(--blue); border-radius: 12px; background: rgba(0, 212, 255, 0.05); }
        .result-link-box a { color: var(--blue); text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← DASHBOARD</a>
    <div class="container">
        <div class="header"><h1>AI TRANSCRIBER</h1></div>
        <p style="text-align:center; font-size:11px; color:#555; margin-bottom:20px;">V2.0 | GLOBAL AI ENGINE</p>
        
        <input type="text" id="audioUrl" class="input-field" placeholder="Paste Audio/Video Link">
        
        <div style="display:flex; gap:10px;">
            <select id="srcLang" class="input-field">
                <option value="auto">Auto Detect</option>
                <option value="hi">Hindi</option>
                <option value="en">English</option>
                <option value="bn">Bengali</option>
                <option value="mr">Marathi</option>
                <option value="gu">Gujarati</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="ur">Urdu</option>
                <option value="pa">Punjabi</option>
                </select>

            <select id="task" class="input-field">
                <option value="transcribe">Original</option>
                <option value="translate">Translate Eng</option>
            </select>
        </div>
        
        <input type="email" id="targetEmail" class="input-field" placeholder="Aapka Email ID">
        <input type="password" id="gToken" class="input-field" placeholder="GitHub Token">
        
        <button class="btn" onclick="runAI()">🎙️ Transcribe & Send</button>

        <div id="resultBox" class="result-link-box">
            <a id="actionLink" href="#" target="_blank">📋 VIEW & COPY TIMELINE TEXT</a>
        </div>

        <div id="status">System: Ready</div>
    </div>

    <script>
        async function runAI() {
            const urlInp = document.getElementById('audioUrl');
            const emailInp = document.getElementById('targetEmail');
            const tokenInp = document.getElementById('gToken');
            const status = document.getElementById('status');
            const resultBox = document.getElementById('resultBox');
            const actionLink = document.getElementById('actionLink');

            if (!urlInp.value.trim()) { alert("⚠️ Video link missing!"); return; }
            if (!emailInp.value.trim()) { alert("⚠️ Email ID missing!"); return; }
            if (!tokenInp.value.trim()) { alert("⚠️ GitHub Token missing!"); return; }

            status.innerText = "⏳ AI Engine Processing...";
            
            try {
                const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/transcribe.yml/dispatches', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${tokenInp.value.trim()}`,
                        'Accept': 'application/vnd.github+json'
                    },
                    body: JSON.stringify({ 
                        ref: 'main', 
                        inputs: { 
                            file_url: urlInp.value.trim(), 
                            email: emailInp.value.trim(), 
                            language: document.getElementById('srcLang').value, 
                            task: document.getElementById('task').value 
                        } 
                    })
                });

                if(res.status === 204) {
                    status.innerHTML = "✅ Request Sent! Check Email in 10 mins.";
                    // Naya logic: Seedha Action page par bhejna taaki user text copy kar sake
                    actionLink.href = "https://github.com/raghavkroynkr/live-stream-engine/actions";
                    resultBox.style.display = "block";
                } else {
                    status.innerText = "❌ Token Error!";
                }
            } catch (err) {
                status.innerText = "❌ System Offline!";
            }
        }
    </script>
</body>
</html>
