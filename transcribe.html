<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TRANSCRIBER PRO</title>
    <style>
        :root { --blue: #00d4ff; --dark: #0a0a0c; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Inter', sans-serif; background: var(--dark); background-image: radial-gradient(circle at 50% -20%, #002244 0%, var(--dark) 80%); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 420px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 25px; box-sizing: border-box; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .header h1 { font-size: 28px; font-weight: 900; text-align: center; text-transform: uppercase; color: var(--blue); margin: 0; }
        .back-btn { align-self: flex-start; color: #666; text-decoration: none; font-size: 14px; margin-bottom: 15px; }
        .input-field { width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; margin-bottom: 12px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: var(--blue); }
        label { font-size: 10px; color: #888; margin-bottom: 5px; display: block; margin-left: 5px; text-transform: uppercase; font-weight: 700; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 15px; color: white; font-weight: 800; cursor: pointer; text-transform: uppercase; background: linear-gradient(135deg, #0088ff, #00d4ff); box-shadow: 0 10px 20px rgba(0, 136, 255, 0.2); }
        #status { text-align:center; margin-top:15px; color:#888; font-size:13px; }
        /* Timeline Copy Section */
        .copy-box { display: none; margin-top: 15px; text-align: center; border: 1px dashed var(--blue); padding: 15px; border-radius: 15px; background: rgba(0, 212, 255, 0.05); }
        .copy-link { color: var(--blue); text-decoration: none; font-weight: 900; font-size: 14px; text-transform: uppercase; }
        select option { background: #111; color: white; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← DASHBOARD</a>
    <div class="container">
        <div class="header"><h1>AI TRANSCRIBER</h1></div>
        <p style="text-align:center; font-size:11px; color:#555; margin-bottom:20px;">V2.1 | GLOBAL MULTI-LANGUAGE ENGINE</p>
        
        <label>Step 1: Paste Media Link</label>
        <input type="text" id="audioUrl" class="input-field" placeholder="Paste Link Here">
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1">
                <label>Step 2: Video Language</label>
                <select id="srcLang" class="input-field">
                    <option value="auto" selected>🌍 Auto Detect</option>
                    <option value="hi">Hindi (हिंदी)</option><option value="en">English</option><option value="bn">Bengali</option><option value="mr">Marathi</option><option value="gu">Gujarati</option><option value="ta">Tamil</option><option value="te">Telugu</option><option value="ur">Urdu</option><option value="pa">Punjabi</option><option value="kn">Kannada</option><option value="ml">Malayalam</option><option value="as">Assamese</option><option value="ne">Nepali</option><option value="sa">Sanskrit</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="ru">Russian</option><option value="zh">Chinese</option><option value="ar">Arabic</option><option value="pt">Portuguese</option><option value="it">Italian</option><option value="tr">Turkish</option><option value="vi">Vietnamese</option><option value="th">Thai</option><option value="id">Indonesian</option>
                </select>
            </div>
            <div style="flex:1">
                <label>Step 3: Result Language</label>
                <select id="taskLang" class="input-field">
                    <option value="transcribe" selected>Original (Same)</option>
                    <option value="translate">English Translate</option>
                    <option value="hi">Hindi (हिंदी)</option><option value="bn">Bengali</option><option value="mr">Marathi</option><option value="gu">Gujarati</option><option value="ta">Tamil</option><option value="te">Telugu</option><option value="ur">Urdu</option><option value="pa">Punjabi</option><option value="kn">Kannada</option><option value="ml">Malayalam</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="ru">Russian</option>
                </select>
            </div>
        </div>
        
        <label>Step 4: Backup & Security</label>
        <input type="email" id="targetEmail" class="input-field" placeholder="Aapka Email ID">
        <input type="password" id="gToken" class="input-field" placeholder="GitHub Classic Token">
        
        <button class="btn" onclick="runAI()">🎙️ Transcribe & Send</button>
        
        <div id="copyArea" class="copy-box">
            <a id="actionUrl" href="#" target="_blank" class="copy-link">📋 CLICK TO COPY TEXT & TIMELINE</a>
            <p style="font-size: 9px; color: #666; margin-top: 8px;">Wait 5-10 mins. Then open link & check 'Summary' tab.</p>
        </div>

        <div id="status">System: Ready</div>
    </div>

<script>
    let checkInterval; // Background checking ke liye

    async function runAI() {
        const url = document.getElementById('audioUrl');
        const email = document.getElementById('targetEmail');
        const token = document.getElementById('gToken');
        const status = document.getElementById('status');
        const copyArea = document.getElementById('copyArea');
        const actionUrl = document.getElementById('actionUrl');
        const repo = "raghavkroynkr/live-stream-engine";

        if (!url.value.trim()) { alert("⚠️ Video Link zaroori hai!"); return; }
        if (!email.value.trim()) { alert("⚠️ Email ID zaroori hai!"); return; }
        if (!token.value.trim()) { alert("⚠️ GitHub Token zaroori hai!"); return; }

        status.innerHTML = "⏳ <span style='color:var(--blue)'>AI Engine Processing...</span>";
        
        const selectedTask = document.getElementById('taskLang').value;
        let finalTask = "transcribe";
        let finalLang = document.getElementById('srcLang').value;

        if(selectedTask === "translate") {
            finalTask = "translate";
        } else if(selectedTask !== "transcribe") {
            finalLang = selectedTask;
        }

        try {
            const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/transcribe.yml/dispatches`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token.value.trim()}`,
                    'Accept': 'application/vnd.github+json'
                },
                body: JSON.stringify({ 
                    ref: 'main', 
                    inputs: { 
                        file_url: url.value.trim(), 
                        email: email.value.trim(), 
                        language: finalLang, 
                        task: finalTask 
                    } 
                })
            });

            if(res.status === 204) {
                // YAHAN BADLAV HAI: User ko ab dashboard par hi wait karwayenge
                status.innerHTML = "✅ AI is working... Don't close this page.";
                // Background mein check karna shuru karein
                startPolling(token.value.trim(), repo);
            } else {
                status.innerHTML = "❌ Error: Token invalid ya permissions issue.";
            }
        } catch (err) {
            status.innerHTML = "❌ Connection Failed!";
        }
    }

    // Naya Function: User ko GitHub dikhaye bina status check karne ke liye
    async function startPolling(token, repo) {
        const status = document.getElementById('status');
        const copyArea = document.getElementById('copyArea');
        
        // Purane button ko hide kar dete hain kyunki user ko wahan nahi jana
        copyArea.style.display = "none";

        checkInterval = setInterval(async () => {
            try {
                const runRes = await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await runRes.json();
                const latestRun = data.workflow_runs[0];

                if(latestRun.status === "in_progress") {
                    status.innerHTML = "⏳ AI Transcribing... (5-10 mins wait)";
                } 
                else if(latestRun.status === "completed") {
                    clearInterval(checkInterval);
                    if(latestRun.conclusion === "success") {
                        status.innerHTML = "<b style='color:#00ffcc'>✅ Transcription Complete! Check your Email.</b>";
                        alert("Bhai, kaam ho gaya! Email check karo.");
                    } else {
                        status.innerHTML = "<b style='color:#ff4444'>❌ AI Processing Failed.</b>";
                    }
                }
            } catch (e) { console.log("Checking status..."); }
        }, 20000); // Har 20 seconds mein status update hoga
    }
</script>

</body>
</html>
