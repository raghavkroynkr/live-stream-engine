<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V3.5 PRO PANEL</title>
    <style>
        :root { --red: #ff0000; --blue: #00d4ff; --dark: #0a0a0c; }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .menu-card { width: 100%; max-width: 360px; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; padding: 25px; margin-bottom: 20px; text-align: center; text-decoration: none; color: white; transition: 0.3s; box-sizing: border-box; }
        .live-btn { border-left: 6px solid var(--red); background: linear-gradient(90deg, rgba(255,0,0,0.1), transparent); }
        .ai-btn { border-left: 6px solid var(--blue); background: linear-gradient(90deg, rgba(0,212,255,0.1), transparent); }
        .menu-card:active { transform: scale(0.96); }
        h2 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 12px; color: #777; margin-top: 8px; }
    </style>
</head>
<body>
    <h1 style="margin-bottom: 30px; font-weight: 900; background: linear-gradient(white, #666); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">V3.5 PRO PANEL</h1>
    
    <a href="live.html" class="menu-card live-btn">
        <h2>🚀 YouTube Live</h2>
        <p>Multi-Link Streaming Engine (5 Slots)</p>

    <a href="transcribe.html" class="menu-card ai-btn">
        <h2>🎙️ AI Transcriber</h2>

    </a>
    
    <a href="builder.html" class="menu-card" style="border-left: 6px solid #00ff88; background: linear-gradient(90deg, rgba(0,255,136,0.1), transparent);">
    <h2>🔨 APK Builder</h2>
    <p>Generate Ad-Free APK from Link</p>
    </a>

    <a href="downloader.html" class="menu-card" style="border-left: 6px solid #ffcc00; background: linear-gradient(90deg, rgba(255,204,0,0.1), transparent);">
    <h2>📥 Video Downloader</h2>
    <p>Download from YouTube, FB, Insta & more</p>
    </a>
    
    
</body>
</html>
