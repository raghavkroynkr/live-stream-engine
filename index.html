<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Engine Pro V3.5</title>
    <style>
        :root {
            --neon-red: #ff003c;
            --dark-bg: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
            --accent-gradient: linear-gradient(135deg, #ff003c 0%, #ff4d00 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% -20%, #3d0000 0%, var(--dark-bg) 80%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            text-align: center;
        }

        .header p {
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
            text-align: center;
        }

        .vLink, .input-field {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: white;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .vLink:focus, .input-field:focus {
            outline: none;
            border-color: var(--neon-red);
            background: rgba(255, 0, 60, 0.05);
        }

        .timer-config {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .btn-launch {
            width: 100%;
            padding: 18px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 0, 60, 0.3);
            text-transform: uppercase;
        }

        .btn-launch:active { transform: scale(0.97); }

        #status-bar {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            font-size: 12px;
            text-align: center;
            color: #777;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #444;
            border-radius: 50%;
            margin-right: 6px;
        }

        .live { background: #00ff88; box-shadow: 0 0 10px #00ff88; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>STREAM ENGINE <span style="font-size: 10px; opacity: 0.5;">v3.5 PRO</span></h1>
        <p>Advanced Multi-Link Scheduler</p>
    </div>

    <div id="links-area">
        <input type="text" class="vLink" placeholder="Video Link 1 (Primary)">
        <input type="text" class="vLink" placeholder="Video Link 2 (Optional)">
        <input type="text" class="vLink" placeholder="Video Link 3 (Optional)">
        <input type="text" class="vLink" placeholder="Video Link 4 (Optional)">
        <input type="text" class="vLink" placeholder="Video Link 5 (Optional)">
    </div>

    <div class="timer-config">
        <input type="number" id="durationValue" class="input-field" placeholder="Duration">
        <select id="durationUnit" class="input-field">
            <option value="minutes">Minutes</option>
            <option value="hours">Hours</option>
            <option value="days">Days</option>
        </select>
    </div>

    <input type="password" id="gToken" class="input-field" placeholder="GitHub Classic Token (ghp_...)">

    <button class="btn-launch" onclick="launchEngine()">🚀 Go Live Now</button>

    <div id="status-bar">
        <span id="dot" class="dot"></span>
        <span id="status-text">Engine Ready</span>
    </div>
</div>

<script>
    async function launchEngine() {
        const links = Array.from(document.querySelectorAll('.vLink')).map(i => i.value.trim()).filter(l => l !== "");
        const token = document.getElementById('gToken').value;
        const val = document.getElementById('durationValue').value;
        const unit = document.getElementById('durationUnit').value;
        const statusText = document.getElementById('status-text');
        const dot = document.getElementById('dot');

        if (links.length === 0 || !token || !val) {
            alert("Bhai, boxes khali hain! Links aur Token bhariye."); return;
        }

        let seconds = parseInt(val);
        if (unit === "minutes") seconds *= 60;
        else if (unit === "hours") seconds *= 3600;
        else if (unit === "days") seconds *= 86400;

        statusText.innerText = "Transmitting to GitHub...";
        dot.classList.add('live');

        try {
            const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/stream.yml/dispatches', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                body: JSON.stringify({ ref: 'main', inputs: { video_urls: links.join(','), duration: seconds.toString() } })
            });

            if (res.status === 204) {
                statusText.innerText = "Live Broadcast Started!";
                statusText.style.color = "#00ff88";
            } else {
                statusText.innerText = "Auth Error: Check Token";
                statusText.style.color = "#ff003c";
                dot.classList.remove('live');
            }
        } catch (err) {
            statusText.innerText = "Connection Failed";
            dot.classList.remove('live');
        }
    }
</script>

</body>
</html>
