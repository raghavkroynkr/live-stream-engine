<div class="container">
    <div class="header">
        <h1>LIVE YOUTUBE</h1>
        <p>Pro Streaming Control</p>
    </div>

    <div id="inputs-wrapper">
        <input type="text" class="vLink" placeholder="Link 1 (Main Stream Video)">
        <input type="text" class="vLink" placeholder="Link 2 (Optional)">
        <input type="text" class="vLink" placeholder="Link 3 (Optional)">
        <input type="text" class="vLink" placeholder="Link 4 (Optional)">
        <input type="text" class="vLink" placeholder="Link 5 (Optional)">
    </div>

    <input type="password" id="sKey" class="input-field" placeholder="YouTube Stream Key (xxxx-xxxx-xxxx-xxxx)" style="border-color: rgba(255, 0, 0, 0.3);">

    <div class="timer-config">
        <input type="number" id="durationValue" class="input-field" placeholder="Time">
        <select id="durationUnit" class="input-field">
            <option value="minutes">Minutes</option>
            <option value="hours">Hours</option>
            <option value="days">Days</option>
        </select>
    </div>

    <input type="password" id="gToken" class="input-field" placeholder="Enter GitHub Token">

    <button class="btn-launch" onclick="launchEngine()">
        <span>🚀</span> GO LIVE NOW
    </button>

    <div id="status-bar">
        <span id="dot" class="dot"></span>
        <span id="status-text">Ready to Broadcast</span>
    </div>
</div>

<script>
    async function launchEngine() {
        const links = Array.from(document.querySelectorAll('.vLink')).map(i => i.value.trim()).filter(l => l !== "");
        const token = document.getElementById('gToken').value;
        const streamKey = document.getElementById('sKey').value; // Naya Stream Key variable
        const val = document.getElementById('durationValue').value;
        const unit = document.getElementById('durationUnit').value;
        const statusText = document.getElementById('status-text');
        const dot = document.getElementById('dot');

        if (links.length === 0 || !token || !val || !streamKey) {
            alert("Bhai, Stream Key aur baaki details zaroori hain!"); return;
        }

        let secs = parseInt(val);
        if (unit === "minutes") secs *= 60;
        else if (unit === "hours") secs *= 3600;
        else if (unit === "days") secs *= 86400;

        statusText.innerText = "Transmitting Key & Signal...";
        dot.classList.add('live');

        try {
            const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/stream.yml/dispatches', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                body: JSON.stringify({ 
                    ref: 'main', 
                    inputs: { 
                        video_urls: links.join(','), 
                        duration: secs.toString(),
                        stream_key: streamKey // Stream Key yahan se bhej rahe hain
                    } 
                })
            });

            if (res.status === 204) {
                statusText.innerText = "Success! Live Started.";
                statusText.style.color = "#00ff88";
            } else {
                statusText.innerText = "Error: Check Token/Key";
                statusText.style.color = "#ff0000";
                dot.classList.remove('live');
            }
        } catch (err) {
            statusText.innerText = "Failed to Reach Engine";
            dot.classList.remove('live');
        }
    }
</script>
