<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Stream Engine V3</title>
    <style>
        :root { --primary: #ff0000; --bg: #0f0f0f; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; padding: 10px; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; width: 100%; max-width: 450px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--primary); font-size: 20px; margin-bottom: 5px; }
        p { color: #888; font-size: 11px; margin-bottom: 15px; }
        .input-box { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: white; box-sizing: border-box; font-size: 13px; }
        .timer-row { display: flex; gap: 10px; margin: 10px 0; }
        .timer-row input { flex: 2; }
        .timer-row select { flex: 1; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        #status { margin-top: 15px; font-size: 12px; color: #aaa; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>LIVE STREAM PRO</h2>
        <p>1 Se 5 Video Links Dalein (Loop Auto-set Hai)</p>
        
        <input type="text" class="vLink" placeholder="Video Link 1 (Direct URL)">
        <input type="text" class="vLink" placeholder="Video Link 2 (Optional)">
        <input type="text" class="vLink" placeholder="Video Link 3 (Optional)">
        <input type="text" class="vLink" placeholder="Video Link 4 (Optional)">
        <input type="text" class="vLink" placeholder="Video Link 5 (Optional)">
        
        <div class="timer-row">
            <input type="number" id="durationValue" placeholder="Duration" min="1">
            <select id="durationUnit">
                <option value="minutes">Minutes</option>
                <option value="hours">Hours</option>
                <option value="days">Days</option>
            </select>
        </div>

        <input type="password" id="gToken" placeholder="GitHub Classic Token (ghp_...)">
        
        <button onclick="launchStream()">🚀 Start Live Now</button>
        <div id="status">Status: Waiting for input...</div>
    </div>

    <script>
        async function launchStream() {
            // Khali boxes ko filter karke sirf links nikalna
            const links = Array.from(document.querySelectorAll('.vLink'))
                             .map(i => i.value.trim())
                             .filter(l => l !== "");
            
            const token = document.getElementById('gToken').value;
            const val = document.getElementById('durationValue').value;
            const unit = document.getElementById('durationUnit').value;
            const status = document.getElementById('status');

            if (links.length === 0 || !token || !val) {
                alert("Kam se kam 1 Link, Token aur Time bhariye!"); return;
            }

            let seconds = parseInt(val);
            if (unit === "minutes") seconds *= 60;
            else if (unit === "hours") seconds *= 3600;
            else if (unit === "days") seconds *= 86400;

            status.innerText = "⏳ Connecting to GitHub Engine...";
            
            try {
                const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/stream.yml/dispatches', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({ 
                        ref: 'main', 
                        inputs: { 
                            video_urls: links.join(','),
                            duration: seconds.toString() 
                        } 
                    })
                });

                if (res.status === 204) {
                    status.innerText = "✅ Success! Stream schedule ho gayi hai.";
                    status.style.color = "#4ade80";
                } else {
                    status.innerText = "❌ Error: Token galat hai ya permissions issue hai.";
                    status.style.color = "#f87171";
                }
            } catch (err) {
                status.innerText = "❌ Network Error!";
            }
        }
    </script>
</body>
</html>
