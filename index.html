<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE YOUTUBE - Pro Control</title>
    <style>
        :root {
            --neon-red: #ff0000;
            --dark-bg: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
            --accent-gradient: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% -20%, #440000 0%, var(--dark-bg) 80%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            letter-spacing: 1px;
        }

        .header p {
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .vLink, .input-field {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 10px;
            display: block; /* Ise grid se bachane ke liye */
        }

        .vLink:focus, .input-field:focus {
            outline: none;
            border-color: var(--neon-red);
            background: rgba(255, 0, 0, 0.05);
        }

        /* Stream Key highlight */
        #sKey {
            border: 1px solid rgba(255, 0, 0, 0.3);
            background: rgba(255, 0, 0, 0.05);
        }

        .timer-config {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .timer-config input { flex: 2; margin-bottom: 0; }
        .timer-config select { flex: 1; margin-bottom: 0; cursor: pointer; }

        .btn-launch {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.2);
            text-transform: uppercase;
            margin-top: 10px;
        }

        .btn-launch:active { transform: scale(0.97); }

        #status-bar {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            font-size: 13px;
            text-align: center;
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #444;
            border-radius: 50%;
            margin-right: 8px;
        }

        .live-dot {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LIVE YOUTUBE</h1>
        <p>Smart Stream Controller</p>
    </div>

    <div id="links-group">
        <input type="text" class="vLink" placeholder="Video Link 1 (Main)">
        <input type="text" class="vLink" placeholder="Video Link 2 (Optional)">
        <input type="text" class="vLink" placeholder="Video Link 3 (Optional)">
        <input type="text" class="vLink" placeholder="Video Link 4 (Optional)">
        <input type="text" class="vLink" placeholder="Video Link 5 (Optional)">
    </div>

    <input type="password" id="sKey" class="input-field" placeholder="YouTube Stream Key">

    <div class="timer-config">
        <input type="number" id="durationValue" class="input-field" placeholder="Time">
        <select id="durationUnit" class="input-field">
            <option value="minutes">Min</option>
            <option value="hours">Hrs</option>
            <option value="days">Days</option>
        </select>
    </div>

    <input type="password" id="gToken" class="input-field" placeholder="GitHub Token (ghp_...)">

    <button class="btn-launch" onclick="launchEngine()">🚀 START BROADCAST</button>

    <div id="status-bar">
        <span id="dot" class="dot"></span>
        <span id="status-text">Engine Ready</span>
    </div>
</div>

<script>
    async function launchEngine() {
        const links = Array.from(document.querySelectorAll('.vLink')).map(i => i.value.trim()).filter(l => l !== "");
        const token = document.getElementById('gToken').value;
        const streamKey = document.getElementById('sKey').value;
        const val = document.getElementById('durationValue').value;
        const unit = document.getElementById('durationUnit').value;
        const statusText = document.getElementById('status-text');
        const dot = document.getElementById('dot');

        if (links.length === 0 || !token || !val || !streamKey) {
            alert("Bhai, sari details bhariye!"); return;
        }

        let secs = parseInt(val);
        if (unit === "minutes") secs *= 60;
        else if (unit === "hours") secs *= 3600;
        else if (unit === "days") secs *= 86400;

        statusText.innerText = "Transmitting Signal...";
        dot.classList.add('live-dot');

        try {
            const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/stream.yml/dispatches', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                body: JSON.stringify({ 
                    ref: 'main', 
                    inputs: { video_urls: links.join(','), duration: secs.toString(), stream_key: streamKey } 
                })
            });

            if (res.status === 204) {
                statusText.innerText = "Stream Activated!";
                statusText.style.color = "#00ff88";
            } else {
                statusText.innerText = "Error: Check Details";
                statusText.style.color = "#ff0000";
                dot.classList.remove('live-dot');
            }
        } catch (err) {
            statusText.innerText = "Connection Failed";
            dot.classList.remove('live-dot');
        }
    }
</script>

</body>
</html>
