<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Panel</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 15px; background: #FF0000; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        #status { margin-top: 20px; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #FF0000; margin-bottom: 5px;">YT Live Engine</h2>
        <p style="font-size: 12px; color: #666;">Mobile Streaming Panel</p>
        <input type="text" id="vUrl" placeholder="YouTube Video Link Yahan Dalein">
        <input type="password" id="gToken" placeholder="GitHub Token (ghp_...)">
        <button onclick="start()">GO LIVE 🚀</button>
        <div id="status">Status: Ready</div>
    </div>
    <script>
        async function start() {
            const url = document.getElementById('vUrl').value;
            const token = document.getElementById('gToken').value;
            const status = document.getElementById('status');
            if(!url || !token) { alert("Link aur Token dono bhariye!"); return; }
            status.innerText = "Processing... Connecting to GitHub Server";
            const res = await fetch('https://api.github.com/repos/raghavkroykr/live-stream-engine/actions/workflows/stream.yml/dispatches', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                body: JSON.stringify({ ref: 'main', inputs: { video_url: url } })
            });
            if (res.status === 204) { status.innerText = "Success! ✅ Check your YouTube Studio."; status.style.color = "green"; }
            else { status.innerText = "Error! Token invalid ya configuration galat hai. ❌"; status.style.color = "red"; }
        }
    </script>
</body>
</html>
