<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAM ENGINE - PRO DASHBOARD</title>
    <style>
        :root { 
            --neon-red: #ff0000; 
            --dark-bg: #000; 
            --card-bg: rgba(20, 20, 25, 0.8);
            --border: rgba(255, 0, 0, 0.2);
        }
        
        body { 
            font-family: 'Inter', sans-serif; background: var(--dark-bg); color: #fff; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; margin: 0; padding: 15px; overflow-x: hidden;
        }

        .watercolor-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(45deg, #1a0000, #000, #00001a, #000);
            background-size: 400% 400%; animation: waterFlow 15s ease infinite;
        }
        @keyframes waterFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .top-nav {
            width: 100%; max-width: 420px; padding: 10px 0 20px 5px;
            display: flex; align-items: center;
        }
        .back-btn {
            color: #666; text-decoration: none; font-size: 14px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; letter-spacing: 1px;
            transition: 0.3s;
        }
        .back-btn:hover { color: var(--neon-red); }

        .container { 
            width: 100%; max-width: 420px; 
            background: var(--card-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 40px; padding: 25px; 
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.15); box-sizing: border-box; 
        }

        .header h1 { 
            font-size: 28px; text-align: center; letter-spacing: 4px; 
            text-transform: uppercase; margin: 0 0 5px 0; font-weight: 900;
            background: linear-gradient(to right, #ff0000, #ff6666);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .sub-text { text-align: center; font-size: 10px; color: #444; margin-bottom: 25px; text-transform: uppercase; }

        .label-text { 
            font-size: 11px; font-weight: 700; color: #ff3333; 
            text-transform: uppercase; margin: 0 0 8px 12px; display: block;
        }

        .input-field, .select-field { 
            width: 100%; padding: 16px; background: rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; 
            color: white; box-sizing: border-box; font-size: 14px; transition: 0.3s;
        }

        select.select-field {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='red' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 15px center; background-size: 14px;
        }

        .v-box { border-left: 4px solid var(--neon-red); margin-bottom: 12px; border-radius: 4px; }

        .btn-start { 
            width: 100%; padding: 20px; border: none; border-radius: 22px; 
            color: white; font-weight: 900; cursor: pointer; text-transform: uppercase; 
            background: linear-gradient(135deg, #ff0000, #800000); 
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.4); margin-top: 20px;
        }

        .info-btn {
            margin-top: 25px; padding: 12px 30px; background: rgba(255, 255, 255, 0.03);
            border-radius: 50px; font-size: 12px; color: #666; text-decoration: none;
            display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.05);
        }

        .status-msg { margin-top: 15px; text-align: center; font-size: 12px; font-weight: 700; color: #444; }
    </style>
</head>
<body>

    <div class="watercolor-bg"></div>

    <div class="top-nav">
        <a href="index.html" class="back-btn">← DASHBOARD</a>
    </div>

    <div class="container">
        <div class="header"><h1>STREAM ENGINE</h1></div>
        <div class="sub-text">Non-Stop 24/7 Looper Active</div>
        
        <div class="v-box"><span class="label-text">🎥 Video Link 01 (Main)</span><input type="text" class="vLink input-field" placeholder="Paste URL..."></div>
        <div class="v-box"><span class="label-text">🎥 Video Link 02</span><input type="text" class="vLink input-field" placeholder="URL 2..."></div>
        <div class="v-box"><span class="label-text">🎥 Video Link 03</span><input type="text" class="vLink input-field" placeholder="URL 3..."></div>
        <div class="v-box"><span class="label-text">🎥 Video Link 04</span><input type="text" class="vLink input-field" placeholder="URL 4..."></div>
        <div class="v-box"><span class="label-text">🎥 Video Link 05</span><input type="text" class="vLink input-field" placeholder="URL 5..."></div>

        <div style="margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.05);"></div>

        <div class="input-box" style="margin-bottom: 15px;">
            <span class="label-text">🔑 YouTube Stream Key</span>
            <input type="password" id="sKey" class="input-field" placeholder="Enter Stream Key...">
        </div>

        <div style="display:flex; gap:12px; margin-bottom: 15px;">
            <div style="flex:1;">
                <span class="label-text">⏱️ Unit</span>
                <select id="timeUnit" class="select-field">
                    <option value="days">Days</option>
                    <option value="hours">Hours</option>
                </select>
            </div>
            <div style="flex:1;">
                <span class="label-text">🔢 Value</span>
                <input type="number" id="timeVal" class="input-field" value="1">
            </div>
        </div>

        <div class="input-box">
            <span class="label-text">🛡️ GitHub Auth (Token)</span>
            <input type="password" id="gToken" class="input-field" placeholder="Paste Token...">
        </div>

        <button class="btn-start" onclick="runEngine()">🚀 LAUNCH LIVE STREAM</button>
        <div id="status" class="status-msg">System: Standby Mode</div>
    </div>

    <a href="guide.html" class="info-btn">
        <span>ℹ️</span> How does this engine work?
    </a>

    <script>
        async function runEngine() {
            const status = document.getElementById('status');
            const token = document.getElementById('gToken').value.trim();
            const sKey = document.getElementById('sKey').value.trim();
            const unit = document.getElementById('timeUnit').value;
            const val = parseFloat(document.getElementById('timeVal').value) || 0;
            
            let finalSeconds = unit === 'days' ? val * 86400 : val * 3600;

            // --- SMART LINK MERGE LOGIC ---
            const linkInputs = document.querySelectorAll('.vLink');
            let linksArray = [];
            linkInputs.forEach(input => { 
                if(input.value.trim() !== "") {
                    linksArray.push(input.value.trim()); 
                }
            });

            // Isme se koi bhi khali hoga tabhi alert aayega
            if(!token || !sKey || linksArray.length === 0 || val <= 0) {
                alert("Details sahi se bhariye bhai (Token, Key aur kam se kam 1 Link)!"); 
                return;
            }

            status.innerHTML = "📡 Firing up the engine...";
            status.style.color = "#ffaa00";

            try {
                const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/stream.yml/dispatches', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`, 
                        'Accept': 'application/vnd.github+json',
                        'X-GitHub-Api-Version': '2022-11-28'
                    },
                    body: JSON.stringify({ 
                        ref: 'main', 
                        inputs: { 
                            video_urls: linksArray.join(','), 
                            stream_key: sKey, 
                            duration: finalSeconds.toString() 
                        } 
                    })
                });

                if(res.status === 204) {
                    status.innerHTML = "✅ SUCCESS! Engine is LIVE.";
                    status.style.color = "#00ffcc";
                } else {
                    // Yahan check kijiye ki aapne token mein 'workflow' permission di hai ya nahi
                    status.innerHTML = "❌ AUTH ERROR: Check Token/Repo.";
                    status.style.color = "#ff4444";
                }
            } catch (err) {
                status.innerHTML = "❌ SYSTEM ERROR!";
                status.style.color = "#ff4444";
            }
        }
    </script>
</body>
</html>
