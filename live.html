<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE STREAM - PRO</title>
    <style>
        :root { --red: #ff0000; --dark: #0a0a0c; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Inter', sans-serif; background: var(--dark); background-image: radial-gradient(circle at 50% -20%, #440000 0%, var(--dark) 80%); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 400px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 25px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); box-sizing: border-box; }
        .header h1 { font-size: 28px; font-weight: 900; text-align: center; text-transform: uppercase; background: linear-gradient(135deg, #ff0000, #aa0000); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        .back-btn { align-self: flex-start; color: #666; text-decoration: none; font-size: 14px; margin-bottom: 15px; }
        .input-field { width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; margin-bottom: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 15px; color: white; font-weight: 800; cursor: pointer; text-transform: uppercase; background: linear-gradient(135deg, #ff0000, #cc0000); box-shadow: 0 10px 20px rgba(255, 0, 0, 0.2); transition: 0.3s; }
        .btn:active { transform: scale(0.96); }
        .status-bar { margin-top: 15px; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); font-size: 13px; text-align: center; color: #888; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← DASHBOARD</a>
    <div class="container">
        <div class="header"><h1>LIVE YOUTUBE</h1></div>
        <p style="text-align:center; font-size:11px; color:#555; margin-bottom:20px;">Multi-Link Streaming Engine</p>
        
        <div id="links-container">
            <input type="text" class="vLink input-field" placeholder="Video Link 1 (Main)">
            <input type="text" class="vLink input-field" placeholder="Video Link 2">
            <input type="text" class="vLink input-field" placeholder="Video Link 3">
        </div>
        
        <input type="password" id="sKey" class="input-field" placeholder="YouTube Stream Key">
        
        <div style="display:flex; gap:10px;">
            <input type="number" id="durVal" class="input-field" placeholder="Time">
            <select id="durUnit" class="input-field"><option value="minutes">Min</option><option value="hours">Hrs</option></select>
        </div>
        
        <input type="password" id="gToken" class="input-field" placeholder="GitHub Token">
        
        <button class="btn" onclick="runLive()">🚀 Start Live Now</button>
        <div id="status" class="status-bar">Engine Status: Standby</div>
    </div>

    <div class="container">
    <h2>🚀 Live Stream Engine v2.0</h2>
    
    <div class="input-group">
        <label>🎥 Video Links (Comma Separated)</label>
        <textarea id="videoUrls" placeholder="Link 1, Link 2, Link 3..." rows="3"></textarea>
        <small>Panch (5) links tak yahan dal sakte hain.</small>
    </div>

    <div class="input-group">
        <label>🔑 YouTube Stream Key</label>
        <input type="password" id="streamKey" placeholder="Enter Stream Key">
    </div>

    <div class="input-group">
        <label>⏱️ Duration (Seconds)</label>
        <input type="number" id="duration" value="3600">
    </div>

    <button onclick="startStreaming()" id="btnText">🔥 Start Non-Stop Stream</button>
    
    <div id="status" class="status-box">Ready to go!</div>
</div>

<script>
    async function startStreaming() {
        const urls = document.getElementById('videoUrls').value;
        const key = document.getElementById('streamKey').value;
        const dur = document.getElementById('duration').value;
        const status = document.getElementById('status');
        const token = "YOUR_GITHUB_TOKEN"; // Ise apne token se badlein

        if(!urls || !key) { alert("Bhai, Links aur Key dono zaroori hain!"); return; }

        status.innerHTML = "⏳ Initializing Engine...";
        
        try {
            const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/stream.yml/dispatches', {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json'
                },
                body: JSON.stringify({ 
                    ref: 'main', 
                    inputs: { 
                        video_urls: urls, 
                        stream_key: key, 
                        duration: dur 
                    } 
                })
            });

            if(res.status === 204) {
                status.innerHTML = "✅ Streaming Started! Check YouTube.";
                status.style.color = "#00ffcc";
            } else {
                status.innerHTML = "❌ GitHub Error: Check Token.";
            }
        } catch (err) {
            status.innerHTML = "❌ Connection Failed!";
        }
    }
</script>

</body>
</html>
