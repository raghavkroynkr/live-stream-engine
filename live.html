<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE STREAM - V3.5</title>
    </head>
<body>
    <div class="container v-live">
        <button onclick="window.location.href='index.html'" style="background:none; border:none; color:#666; margin-bottom:10px;">← Back</button>
        <div class="header"><h1>LIVE YOUTUBE</h1></div>
        <div id="live-inputs">
            <input type="text" class="vLink" placeholder="Video Link 1 (Main)">
            <input type="text" class="vLink" placeholder="Video Link 2">
            <input type="text" class="vLink" placeholder="Video Link 3">
            <input type="text" class="vLink" placeholder="Video Link 4">
            <input type="text" class="vLink" placeholder="Video Link 5">
        </div>
        <input type="password" id="sKey" class="input-field" placeholder="YouTube Stream Key">
        <div class="timer-config">
            <input type="number" id="durVal" class="input-field" placeholder="Time">
            <select id="durUnit" class="input-field"><option value="minutes">Min</option><option value="hours">Hrs</option></select>
        </div>
        <input type="password" id="gToken" class="input-field" placeholder="GitHub Token">
        <button id="btn-live" class="btn" onclick="runLive()">🚀 Start Live Now</button>
        <div id="live-status" class="status">Engine Ready</div>
    </div>
    <script>
        // Wahi runLive() function jo humne pehle check kiya tha
    </script>
</body>
</html>
