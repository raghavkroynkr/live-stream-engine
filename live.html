<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE STREAM - PRO</title>
    <style>
        /* CSS wahi rakhein jo humne finalize kiya tha premium dark wala */
        body { font-family: 'Inter', sans-serif; background: #0a0a0c; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 25px; box-sizing: border-box; }
        .input-field, .vLink { width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; margin-bottom: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 15px; background: linear-gradient(135deg, #ff0000, #cc0000); color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .back-btn { align-self: flex-start; color: #666; text-decoration: none; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Home</a>
    <div class="container">
        <h1 style="text-align:center; color:#ff0000;">LIVE YOUTUBE</h1>
        <div id="live-inputs">
            <input type="text" class="vLink" placeholder="Video Link 1 (Main)">
            <input type="text" class="vLink" placeholder="Video Link 2">
            <input type="text" class="vLink" placeholder="Video Link 3">
            <input type="text" class="vLink" placeholder="Video Link 4">
            <input type="text" class="vLink" placeholder="Video Link 5">
        </div>
        <input type="password" id="sKey" class="input-field" placeholder="Stream Key">
        <div style="display:flex; gap:10px;">
            <input type="number" id="durVal" class="input-field" placeholder="Time">
            <select id="durUnit" class="input-field"><option value="minutes">Min</option><option value="hours">Hrs</option></select>
        </div>
        <input type="password" id="gToken" class="input-field" placeholder="GitHub Token">
        <button class="btn" onclick="runLive()">🚀 Start Live</button>
        <div id="status" style="text-align:center; margin-top:15px; font-size:12px; color:#888;">Ready</div>
    </div>

    <script>
        async function runLive() {
            const links = Array.from(document.querySelectorAll('.vLink')).map(i => i.value.trim()).filter(l => l !== "");
            const token = document.getElementById('gToken').value;
            const skey = document.getElementById('sKey').value;
            const val = document.getElementById('durVal').value;
            const unit = document.getElementById('durUnit').value;
            if(!links[0] || !token || !skey) { alert("Details missing!"); return; }
            document.getElementById('status').innerText = "⏳ Signal Sending...";
            const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/stream.yml/dispatches', {
                method: 'POST', headers: { 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ ref: 'main', inputs: { video_urls: links.join(','), duration: (parseInt(val)*(unit==="minutes"?60:3600)).toString(), stream_key: skey } })
            });
            if(res.status === 204) document.getElementById('status').innerText = "✅ Stream Started!";
        }
    </script>
</body>
</html>
