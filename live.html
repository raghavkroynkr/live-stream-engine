<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE STREAM - ULTIMATE PRO</title>
    <style>
        :root { 
            --neon-red: #ff0000; 
            --dark-bg: #0d0d0f; 
            --card-bg: rgba(20, 20, 25, 0.7);
            --border: rgba(255, 0, 0, 0.2);
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--dark-bg); 
            background-image: radial-gradient(circle at 50% 0%, #3a0000 0%, #0d0d0f 70%); 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            width: 100%; 
            max-width: 420px; 
            background: var(--card-bg); 
            backdrop-filter: blur(20px); 
            border: 1px solid var(--border); 
            border-radius: 35px; 
            padding: 30px; 
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.15); 
            box-sizing: border-box; 
        }

        .header h1 { 
            font-size: 26px; 
            text-align: center; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            background: linear-gradient(to right, #ff0000, #ff6666); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 5px;
        }

        .input-box { margin-bottom: 18px; position: relative; }
        
        /* Clear Labels for every box */
        .label-text { 
            font-size: 11px; 
            font-weight: 700; 
            color: #ff3333; 
            text-transform: uppercase; 
            margin-bottom: 6px; 
            display: block; 
            letter-spacing: 1px;
            margin-left: 10px;
        }

        .input-field { 
            width: 100%; 
            padding: 15px; 
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 15px; 
            color: white; 
            box-sizing: border-box; 
            transition: 0.3s;
            font-size: 14px;
        }

        .input-field:focus { 
            border-color: var(--neon-red); 
            outline: none; 
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3); 
        }

        /* 5 Unique Video Boxes */
        .v-box { border-left: 3px solid var(--neon-red); margin-bottom: 10px; }

        .btn-start { 
            width: 100%; 
            padding: 20px; 
            border: none; 
            border-radius: 18px; 
            color: white; 
            font-weight: 900; 
            cursor: pointer; 
            text-transform: uppercase; 
            background: linear-gradient(135deg, #ff0000, #990000); 
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.3); 
            transition: 0.4s ease; 
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .btn-start:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255, 0, 0, 0.5); }

        /* Stylish Info Button */
        .info-btn {
            margin-top: 25px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .status-msg { margin-top: 15px; text-align: center; font-size: 13px; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header"><h1>STREAM ENGINE PRO</h1></div>
        <p style="text-align:center; font-size:10px; color:#555; margin-bottom:25px;">Non-Stop 24/7 Looper Active</p>
        
        <div class="v-box"><span class="label-text">🎥 Video Link 01 (Main)</span><input type="text" class="vLink input-field" placeholder="Paste URL Here..."></div>
        <div class="v-box"><span class="label-text">🎥 Video Link 02</span><input type="text" class="vLink input-field" placeholder="Optional URL..."></div>
        <div class="v-box"><span class="label-text">🎥 Video Link 03</span><input type="text" class="vLink input-field" placeholder="Optional URL..."></div>
        <div class="v-box"><span class="label-text">🎥 Video Link 04</span><input type="text" class="vLink input-field" placeholder="Optional URL..."></div>
        <div class="v-box"><span class="label-text">🎥 Video Link 05</span><input type="text" class="vLink input-field" placeholder="Optional URL..."></div>

        <hr style="opacity:0.05; margin:20px 0;">

        <div class="input-box">
            <span class="label-text">🔑 YouTube Stream Key</span>
            <input type="password" id="sKey" class="input-field" placeholder="Paste your stream key here">
        </div>

        <div style="display:flex; gap:12px;">
            <div class="input-box" style="flex:1;">
                <span class="label-text">⏱️ Timer (Sec)</span>
                <input type="number" id="durVal" class="input-field" value="3600">
            </div>
            <div class="input-box" style="flex:2;">
                <span class="label-text">🛡️ GitHub Auth Password (Token)</span>
                <input type="password" id="gToken" class="input-field" placeholder="Paste Token">
            </div>
        </div>

        <button class="btn-start" onclick="runEngine()">🚀 Launch Live Stream</button>
        <div id="status" class="status-msg">System: Standby Mode</div>
    </div>

    <a href="guide.html" class="info-btn">
        <span>ℹ️</span> How does this engine work?
    </a>

    <script>
        async function runEngine() {
            const status = document.getElementById('status');
            const token = document.getElementById('gToken').value;
            const sKey = document.getElementById('sKey').value;
            const duration = document.getElementById('durVal').value;
            
            const linkInputs = document.querySelectorAll('.vLink');
            let linksArray = [];
            linkInputs.forEach(input => {
                if(input.value.trim() !== "") linksArray.push(input.value.trim());
            });

            if(linksArray.length === 0 || !sKey || !token) {
                alert("Bhai, Details dalo pehle!");
                return;
            }

            status.innerHTML = "📡 Sending signals to GitHub...";
            status.style.color = "#ffaa00";

            try {
                const res = await fetch('https://api.github.com/repos/raghavkroynkr/live-stream-engine/actions/workflows/stream.yml/dispatches', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github+json'
                    },
                    body: JSON.stringify({ 
                        ref: 'main', 
                        inputs: { video_urls: linksArray.join(','), stream_key: sKey, duration: duration } 
                    })
                });

                if(res.status === 204) {
                    status.innerHTML = "✨ Engine Fired! Stream is LIVE.";
                    status.style.color = "#00ffcc";
                } else {
                    status.innerHTML = "❌ Auth Failed: Check Token.";
                    status.style.color = "#ff4444";
                }
            } catch (err) {
                status.innerHTML = "❌ System Offline!";
                status.style.color = "#ff4444";
            }
        }
    </script>
</body>
</html>
